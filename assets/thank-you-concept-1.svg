<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Concept merci premium Coffee Break TCG">
  <defs>
    <style>
      @keyframes rise { 0% { transform: translateY(76px); opacity: 0; } 24%, 78% { opacity: 1; } 100% { transform: translateY(-42px); opacity: .95; } }
      @keyframes cardA { 0% { transform: translate(160px, 520px) rotate(-14deg) scale(.9); opacity: 0; } 28%, 100% { transform: translate(160px, 470px) rotate(-8deg) scale(1); opacity: 1; } }
      @keyframes cardB { 0% { transform: translate(700px, 520px) rotate(12deg) scale(.9); opacity: 0; } 36%, 100% { transform: translate(700px, 458px) rotate(7deg) scale(1); opacity: 1; } }
      @keyframes logoLift { 0% { transform: translateY(48px) scale(.84); opacity: 0; } 32%, 76% { transform: translateY(-10px) scale(1); opacity: 1; } 100% { transform: translateY(-34px) scale(1.02); opacity: .96; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.025); opacity: 1; } }
      @keyframes shine { 0% { transform: translateX(-420px) rotate(18deg); opacity: 0; } 35% { opacity: .3; } 75%, 100% { transform: translateX(840px) rotate(18deg); opacity: 0; } }
      .bg { fill: #fbead8; }
      .orange { fill: #d5742d; }
      .coffee { fill: #3b241a; }
      .muted { fill: #846451; }
      .cream { fill: #fff7ea; }
      .title { font-family: "Rubik One", "Arial Black", sans-serif; font-size: 76px; letter-spacing: 0; }
      .copy { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
      #content { transform-origin: 540px 675px; animation: rise 3.6s ease-in-out infinite; }
      #left-card { transform-box: fill-box; transform-origin: center; animation: cardA 3.6s cubic-bezier(.2,.8,.2,1) infinite; }
      #right-card { transform-box: fill-box; transform-origin: center; animation: cardB 3.6s cubic-bezier(.2,.8,.2,1) infinite; }
      #seal { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
      #cbtn-logo { transform-box: fill-box; transform-origin: center; animation: logoLift 3.6s cubic-bezier(.2,.8,.2,1) infinite; }
      #shine { animation: shine 3.6s ease-in-out infinite; }
    </style>
    <clipPath id="round">
      <rect x="80" y="80" width="920" height="1190" rx="48"/>
    </clipPath>
  </defs>
  <rect class="bg" width="1080" height="1350"/>
  <g clip-path="url(#round)">
    <rect x="80" y="80" width="920" height="1190" rx="48" fill="#fff6ea"/>
    <circle cx="540" cy="430" r="300" fill="#d5742d" opacity=".09"/>
    <rect id="shine" x="100" y="80" width="120" height="1190" fill="#fff" opacity=".24"/>
    <g id="left-card">
      <rect width="164" height="228" rx="16" fill="#fff" stroke="#ead0b8" stroke-width="5"/>
      <rect x="18" y="20" width="128" height="120" rx="10" fill="#f2c978"/>
      <circle cx="82" cy="80" r="38" fill="#d5742d" opacity=".82"/>
      <rect x="24" y="158" width="116" height="12" rx="6" fill="#3b241a" opacity=".22"/>
      <rect x="24" y="181" width="84" height="10" rx="5" fill="#3b241a" opacity=".16"/>
    </g>
    <g id="right-card">
      <rect width="164" height="228" rx="16" fill="#fff" stroke="#ead0b8" stroke-width="5"/>
      <rect x="18" y="20" width="128" height="120" rx="10" fill="#b8d6bf"/>
      <circle cx="82" cy="80" r="38" fill="#3b241a" opacity=".78"/>
      <rect x="24" y="158" width="116" height="12" rx="6" fill="#3b241a" opacity=".22"/>
      <rect x="24" y="181" width="84" height="10" rx="5" fill="#3b241a" opacity=".16"/>
    </g>
    <g id="content">
      <g id="seal">
        <circle cx="540" cy="452" r="172" class="orange"/>
        <circle cx="540" cy="452" r="140" fill="none" stroke="#fff7ea" stroke-width="10" opacity=".82"/>
        <image id="cbtn-logo" href="/assets/coffee-break-logo-cbtcg-wordmark-transparent.png" x="296" y="350" width="488" height="204" preserveAspectRatio="xMidYMid meet"/>
      </g>
      <text x="540" y="725" text-anchor="middle" class="title orange">MERCI!</text>
      <text x="540" y="785" text-anchor="middle" class="copy coffee">Ta commande est confirmee.</text>
      <text x="540" y="835" text-anchor="middle" class="copy muted">On prepare tes cartes avec soin.</text>
      <rect x="323" y="910" width="434" height="72" rx="36" class="orange"/>
      <text x="540" y="957" text-anchor="middle" class="small cream">COFFEE BREAK TCG</text>
    </g>
  </g>
</svg>
